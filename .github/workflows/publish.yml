name: Publish to PyPI

# PyPI publishing is disabled. Releases ship as container images instead, see
# publish-image.yml. This workflow no longer runs on version tags and is left
# here so it can be run by hand, or re-enabled by restoring the tag trigger:
#
#   on:
#     push:
#       tags:
#         - "v*.*.*"
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # PyPI refuses a re-upload of an existing version, so a tag that
      # disagrees with pyproject.toml must fail here rather than at upload.
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            exit 1
          fi
          echo "Publishing version ${version} from tag ${GITHUB_REF_NAME}."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
